# 外置摄像头游戏目标检测 MVP 配置
camera:
  source: 0            # 摄像头编号 / 名称关键字 / 视频文件路径 / "ndi:<源名关键字>"（命令行 --source 可覆盖）
                       # NDI 架构：B 机游戏 → B OBS(NDI 输出) → 局域网 → 本机脚本直接收（不经本机 OBS）。
                       # 如 "ndi:Game-PC"；菜单「设置→摄像头」会列出局域网上的 NDI 源。整幅画面即游戏，标定用「自动」。
  width: 1920          # 摄像头采集分辨率（NDI 源由发送端决定，此处忽略）
  height: 1080
  loop_video: false    # 视频文件播放到结尾是否循环
  ndi_transport: tcp   # NDI 传输：tcp（实测唯一能出图的）/ auto（libndi 默认，优先 RUDP，本网上收不到帧）

minimap:               # 左上角小地图黄点 = 玩家绝对地图位置（minimap.py）。巡逻端点 mode=minimap 时用它，不受镜头跟随/宠物遮挡影响
  enabled: true
  region: [0, 0, 400, 260]   # 小地图窗口大致范围（矫正后画面坐标，要把整个窗口含右/下边框框进来）；缩略图区域在其中按边框颜色自动找
  px_scale: 10               # 1 个小地图像素 ≈ 多少画面像素（勇士部落东入口实测 10.3）；只用来让 patrol_tolerance 含义不变
  yellow_lo: [20, 120, 180]  # 黄点 HSV 下限
  yellow_hi: [38, 255, 255]
  min_area: 10               # 黄点面积范围（720p 下实测 15~45；地图上零星黄色 ≤6）
  max_area: 90

screen:
  calibration_file: calibration/homography.json
  output_width: 1280   # 矫正后“虚拟游戏画面”的尺寸（模板尺寸与此绑定）
  output_height: 720

roi:
  mode: player         # fixed | player
  # mode=fixed 时使用（矫正后画面坐标）
  fixed: [640, 280, 1000, 460]   # x1, y1, x2, y2
  # mode=player 时：先用名牌模板定位玩家，再取前方区域
  player:
    template: templates/players/KEEEE.png   # 玩家名牌模板（菜单「玩家设置」会自动改）
    search_band: [0, 150, 1280, 620]   # 只在这个区域找名牌 x1,y1,x2,y2
    match_threshold: 0.55      # 全局搜索阈值
    local_threshold: 0.5       # 局部跟踪阈值
    track_window: 120          # 跟踪搜索窗口半径(px)
    lost_max: 5                # 连续丢失多少帧后全局重搜
    # 中间层：小窗跟丢后先在上一位置 ±mid_window 内找，>=mid_threshold 就接受（位置连续性）。
    # 屏幕边缘的真名牌只有 0.67~0.76，够不到全局阈值；假名牌分数与之重叠，只能靠位置区分。0 关闭。
    edge_threshold: 0.72       # 屏幕最左/最右名牌被切掉一半时，用半张模板在边缘窄条里找（0 关闭）
    mid_window: [300, 120]
    mid_threshold: 0.72   # 录像回归扫出来的最低安全值：0.70/0.71 会锁到上一层平台上别人的名牌，0.72 起干净
    # 名牌匹配点（名牌左上角）到角色脚底中心的偏移
    anchor_dx: 23
    anchor_dy: 12
  facing: key          # key | auto | right | left | both
                       # key  = 用决策按住的方向键定朝向（推荐：只检测前进方向，不会背对怪挥刀，ROI 减半）
                       # auto = 按位移估计前进方向（原地转身不更新，弱点见 README）
  facing_auto:
    window: 10         # 累计最近 N 帧的世界位移
    min_move: 20       # 累计位移超过多少像素才切换朝向
    band: [0, 100, 1280, 600]   # 估计背景滚动用的画面带（避开 HUD）
    scale: 0.25
  scroll_band: [0, 350, 1280, 650]   # 背景滚动量估计用的画面带（平台/树这一层；避开 HUD 和视差天空）
  world:                 # 地图 x 估计（worldpos.py）：屏幕 x + 累加的镜头位移；地标校准防漂移
    enabled: true
    deadband: 1.0        # |bg_dx| 小于此值视为噪声不累加（静止噪声 ±0.3，真实滚动 3~5/帧）
    lock_frames: 20      # 「人在走、背景不滚」持续这么多帧且人贴近屏幕边缘 -> 到了地图边界，归零/校 cam_w
    move_px: 50
    scroll_px: 6
    landmark_thr: 0.9    # 地标匹配分下限（录像回放里真匹配中位 0.94，错配到相邻瓦片的 0.80~0.87）
    fix_every: 5         # 每几帧找一次地标
    landmark_box: [150, 250, 100]   # 标端点时抠地标的范围：玩家 x±150，y 从脚底上方 250 到上方 100（避开人物和地面怪）
    # 实际由 worldpos.pick_landmark 在几个候选框里挑「最不像相邻瓦片」的一块，这里只是第一个候选
  near_offset: 20      # 从角色中心向前起算
  far_offset: 320
  up: 70               # 相对角色脚底向上。只覆盖同一层（地面攻击只打同层；蜗牛高约 40px）。
                       # 原来 180 会把上一层平台和树叶间的天空框进来 -> 大量误报 + 对空挥刀
  down: 20

detection:
  method: template_matching
  threshold: 0.55      # 模板分阈值。开了 color_verify 后可以放低（候选由颜色校验把关）；不开时需 ~0.78+
  scales: [1.0]        # 多尺度匹配，如 [0.9, 1.0, 1.1]
  grayscale: true
  flip: true           # 模板水平翻转增强（覆盖怪物左右朝向）
  color_verify:        # 候选框的 H-S 颜色直方图须与模板相近，否则否决（拒掉蓝天/树干/地面等灰度相似的假框）
    enabled: true
    max_dist: 0.48     # Bhattacharyya 距离上限。woniu 标注集：无怪候选最小 0.46，有怪多在 0.27~0.48（余量薄，多采数据后重标）
    edge_min: 0.4      # 候选框与模板在 Sobel 边缘图上的匹配分下限（怪物有粗黑轮廓；灌木/天空假框实测 ≤0.29）
    topk: 3            # 每张模板检查前几个峰（第一个峰常是假框，真怪可能排第二）

debounce:
  window_size: 5
  enter_min_hits: 3    # 最近 N 帧中 >= 3 帧命中 -> detected
  exit_min_misses: 4   # 最近 N 帧中 >= 4 帧未命中 -> not detected

monster:
  current: stump_map01   # 对应 templates/<name>/ 目录；启动时会列出所有目录供选择
  ask_on_start: true     # 启动时是否让人工选择怪物（--monster 指定时跳过）

control:                 # P5/P6：检测结果 -> 按键（decision.py）
  mode: dry              # off=只检测 | dry=只打日志不发按键 | pico=真发给 Pico
  pico_host: null        # Pico IP；null=局域网广播自动发现（找不到会退化为 dry）
  attack_key: ctrl       # 攻击键（Pico 键名：a-z 0-9 ctrl shift alt space 等）
  attack_press_ms: 60
  attack_interval_ms: 700  # 两次攻击间隔（≈攻击动画时长）；实际不会短于按键执行时间
  pickup_key: z          # 拾取键：控制期间每隔随机时间点按一次；null 关闭
  pickup_press_ms: 60
  pickup_interval_ms: [500, 1000]  # 两次拾取之间的随机间隔范围
  attack_range_px: 130   # 怪离玩家多近才算进入攻击范围（矫正后画面像素）；更远则先接近
  approach: true         # 怪太远时按住方向键走过去
  patrol: true           # 没怪时来回巡逻；false=原地等
  # P7 位置巡逻：地图两端点（矫正后画面 x）。菜单「标定巡逻端点」按怪物名存进 settings.yaml 的 patrol 段，
  # app.py 启动时按当前怪物取出来填到这里。两个都为 null 时退化成下面的「按时间掉头」。
  patrol_left_x: null
  patrol_right_x: null
  patrol_seek: true      # 地图坐标模式下还没被地标/边界校准过时：一直朝一个方向走去找地标（卡住则由 P10 掉头），而不是按时间掉头
  patrol_tolerance: 50   # 玩家 x 进到端点这个范围内就算到端点，换朝另一端走。含换向延迟造成的越过量：
                         # 走速 ≈105 px/s × (KEY_UP+KEY_DOWN 两拍 120 ms + 游戏响应) ≈ 40 px，真机实测越过 ~55 px
  walk_max_ms: 3000      # 时间巡逻（未标端点时）单方向最多走多久后掉头
  turn_press_ms: 60      # 转身时方向键点按时长
  # P9 卡住检测（只报警不动作）：按着方向键 stuck_ms 内 玩家 x 位移 <= stuck_move_px 且 背景滚动 <= stuck_scroll_px/帧
  stuck_ms: 1500
  stuck_move_px: 3
  stuck_scroll_px: 1.5
  # P10 跳跃恢复：卡住 -> 按着方向键点一下跳跃键；jump_recover_ms 内观察；连续 jump_max_retry 次无效 -> 掉头
  jump_on_stuck: false
  jump_key: alt
  jump_press_ms: 80
  jump_recover_ms: 900
  jump_max_retry: 3
  jump_clear_px: 40      # 跳后离开卡住点这么远（位移+镜头滚动）才算脱困；顶墙弹回只有十几像素不算
  giveup_walk_ms: 4000   # 放弃掉头后，这段时间内端点逻辑不翻转（卡在端点外侧时否则会立刻翻回来）
  # 拟人随机（2026-08-28）：0 = 关
  human_jump_per_min: 4      # 巡逻中平均每分钟随机跳几次（泊松间隔）
  human_jump_min_gap_ms: 2500  # 两次随机跳最短间隔
  human_endpoint_px: 60      # 每次掉头时下一个端点随机多走/少走 ±这么多（屏幕 px；小地图模式下 ×10 后的单位，60≈6 个小地图像素）
  human_pause_ms: 800        # 到端点后随机停 0~这么久再走
  human_walk_jitter: 0.2     # 时间巡逻的 walk_max_ms 抖动 ±20%
  lost_release_frames: 10  # 玩家定位连续丢失多少帧后松开全部按键
  sync_interval_ms: 1000 # 定期重发期望按键状态（抗 UDP 丢包）
  start_dir: right

logging:
  dir: logs
  console_every_n: 15
